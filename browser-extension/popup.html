<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mangar Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" width="20" height="20" alt="" />
      <h1>Mangar Downloader</h1>
    </header>
    <main>
      <section id="page" hidden aria-labelledby="page-title">
        <h2 id="page-title" class="video-title">Видео на странице</h2>
        <p id="page-facts" class="media-details" hidden></p>
        <div class="actions">
          <button id="send-page" type="button" disabled>Скачать</button>
        </div>
      </section>
      <section id="media" hidden aria-label="Видео из браузера">
        <div id="candidates" aria-busy="true"></div>
      </section>
    </main>
    <p id="status" role="status" aria-live="polite"></p>
    <footer id="privacy">
      <div
        id="privacy-info"
        class="privacy-notice"
        role="note"
        tabindex="0"
        hidden
      >
        <p>Данные передаются только локальному приложению Mangar.</p>
        <p class="privacy-detail">
          Для выбранного видео могут передаваться необходимые заголовки и
          cookies.
        </p>
      </div>
      <div class="info-row">
        <button
          id="privacy-toggle"
          class="info-button"
          type="button"
          aria-label="Информация о конфиденциальности"
          aria-expanded="false"
          aria-controls="privacy-info"
          aria-describedby="privacy-info"
        >
          <span aria-hidden="true">ⓘ</span>
        </button>
      </div>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
