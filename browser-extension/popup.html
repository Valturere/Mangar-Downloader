<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mangar Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" width="20" height="20" alt="" />
      <h1>Mangar Downloader</h1>
    </header>
    <main>
      <section id="page" hidden aria-labelledby="page-title">
        <h2 id="page-title" class="video-title">Видео на странице</h2>
        <p id="page-host" class="host technical"></p>
        <div class="actions">
          <button id="send-page" type="button" disabled>
            Скачать в Mangar
          </button>
        </div>
      </section>
      <section id="media" hidden aria-label="Видео из браузера">
        <details id="media-disclosure">
          <summary>Видео из браузера</summary>
          <div id="candidates" aria-busy="true"></div>
        </details>
      </section>
    </main>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="privacy-notice">
      Расширение временно видит адреса медиазапросов и их контекст. По нажатию
      выбранная ссылка, а для потока — также заголовки и cookies, передаются
      локальному Mangar. Серверу разработчика данные не отправляются.
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
